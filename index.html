<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker App</title>
  <!-- Tailwidcss internal Link -->
  <script src="https://cdn.tailwindcss.com"></script>  

  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .glass {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen text-white p-6">

  <div class="max-w-5xl mx-auto">

    <div class="text-center mb-10">
      <h1 class="text-5xl font-bold mb-3">💸 Expense Tracker</h1>
      <p class="text-slate-300 text-lg">
        Track your income & expenses easily
      </p>
    </div>


    <!-- TOP CARDS effects -->
    <div class="grid md:grid-cols-3 gap-6 mb-10">

      <div class="glass rounded-3xl p-6 shadow-2xl">
        <h2 class="text-xl mb-2 text-slate-300">Total Balance</h2>
        <h1 id="balance" class="text-4xl font-bold text-cyan-400">৳0</h1>
      </div>

      <div class="glass rounded-3xl p-6 shadow-2xl">
        <h2 class="text-xl mb-2 text-slate-300">Income</h2>
        <h1 id="income" class="text-4xl font-bold text-green-400">৳0</h1>
      </div>

      <div class="glass rounded-3xl p-6 shadow-2xl">
        <h2 class="text-xl mb-2 text-slate-300">Expense</h2>
        <h1 id="expense" class="text-4xl font-bold text-red-400">৳0</h1>
      </div>
    </div>


    <!-- FORM of the content -->
    <div class="glass rounded-3xl p-6 shadow-2xl mb-10">
      <h2 class="text-3xl font-bold mb-6">Add Transaction</h2>

      <div class="grid md:grid-cols-2 gap-5">

        <input
          id="title"
          type="text"
          placeholder="Enter title"
          class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-cyan-400"
        />

        <input
          id="amount"
          type="number"
          placeholder="Enter amount"
          class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-cyan-400"
        />

        <select
          id="type"
          class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-cyan-400"
        >
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>

        <button
          onclick="addTransaction()"
          class="bg-cyan-500 hover:bg-cyan-400 rounded-xl py-3 font-bold transition-all"
        >
          Add Transaction
        </button>
      </div>
    </div>


    <!-- TRANSACTION LIST -->
    <div class="glass rounded-3xl p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
        <h2 class="text-3xl font-bold">Transaction History</h2>

        <button
          onclick="clearAll()"
          class="bg-red-500 hover:bg-red-400 px-5 py-2 rounded-xl font-semibold"
        >
          Clear All
        </button>
      </div>

      <div id="transactionList" class="space-y-4"></div>
    </div>
  </div>


<script>
  
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

    const balance = document.getElementById('balance');
    const income = document.getElementById('income');
    const expense = document.getElementById('expense');
    const transactionList = document.getElementById('transactionList');


    function saveToLocalStorage() {
      localStorage.setItem('transactions', JSON.stringify(transactions));
    }


    function addTransaction() {
      const title = document.getElementById('title').value;
      const amount = document.getElementById('amount').value;
      const type = document.getElementById('type').value;

      if(title === '' || amount === '') {
        alert('Please fill all fields');
        return;
      }

      const transaction = {
        id: Date.now(),
        title,
        amount: Number(amount),
        type
      };

      transactions.push(transaction);

      saveToLocalStorage();
      renderTransactions();
      updateSummary();

      document.getElementById('title').value = '';
      document.getElementById('amount').value = '';
    }


    function renderTransactions() {
      transactionList.innerHTML = '';

      transactions.reverse().forEach(transaction => {

        const div = document.createElement('div');

        div.className = `
          flex items-center justify-between
          bg-slate-800 rounded-2xl p-5
          border-l-8
          ${transaction.type === 'income' ? 'border-green-400' : 'border-red-400'}
        `;

        div.innerHTML = `
          <div>
            <h3 class="text-xl font-bold">${transaction.title}</h3>
            <p class="text-slate-400 capitalize">${transaction.type}</p>
          </div>

          <div class="flex items-center gap-4">
            <h2 class="text-2xl font-bold ${transaction.type === 'income' ? 'text-green-400' : 'text-red-400'}">
              ${transaction.type === 'income' ? '+' : '-'}৳${transaction.amount}
            </h2>

            <button
              onclick="deleteTransaction(${transaction.id})"
              class="bg-red-500 hover:bg-red-400 px-4 py-2 rounded-lg"
            >
              Delete
            </button>
          </div>
        `;

        transactionList.appendChild(div);
      });

      transactions.reverse();
    }


    function updateSummary() {

      const incomeAmount = transactions
        .filter(item => item.type === 'income')
        .reduce((acc, item) => acc + item.amount, 0);

      const expenseAmount = transactions
        .filter(item => item.type === 'expense')
        .reduce((acc, item) => acc + item.amount, 0);

      const totalBalance = incomeAmount - expenseAmount;

      balance.innerText = `৳${totalBalance}`;
      income.innerText = `৳${incomeAmount}`;
      expense.innerText = `৳${expenseAmount}`;
    }


    function deleteTransaction(id) {
      transactions = transactions.filter(item => item.id !== id);

      saveToLocalStorage();
      renderTransactions();
      updateSummary();
    }


    function clearAll() {
      transactions = [];

      saveToLocalStorage();
      renderTransactions();
      updateSummary();
    }


    renderTransactions();
    updateSummary();

</script>
</body>
</html>
